# 管理器包名（Android applicationId）的单一真源 / single source of truth.
#
# 四条构建路径都从这里取值，任何一处都不许再写自己的字面量默认值：
#   manager/app/build.gradle.kts   → applicationId
#   kernel/manager-package.mk      → KSU_PACKAGE_NAME（内核编译期宏，Kbuild include）
#   userspace/ksud/build.rs        → KSU_PACKAGE_NAME（env! 编译期常量）
#   scripts/check_manager_package.py → CI 一致性校验（构建前断言三方取值相同）
#
# 不变式：内核编译进去的 KSU_PACKAGE_NAME 必须与 manager APK 的 applicationId
# 逐字节相同，否则 throne_tracker 永远匹配不到管理器，app 只能跑 preview 模式。
# 改这里必须同时满足：KSU_MANAGER_PACKAGE_NAME_PR == KSU_MANAGER_PACKAGE_NAME + ".pr"，
# CI 会断言。签名证书（secrets.KEYSTORE / EXPECTED_HASH）与此文件无关，不要混改。
#
# 格式约束：必须是 `KEY=value`，无空格、无引号、无插值、无行尾注释——
# 这样它同时是 make 的 include 文件、Java Properties 文件和 shell 的 source 文件。
KSU_MANAGER_PACKAGE_NAME=com.yufeng.sukisu.ultra
KSU_MANAGER_PACKAGE_NAME_PR=com.yufeng.sukisu.ultra.pr
